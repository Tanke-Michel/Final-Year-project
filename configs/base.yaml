# Fixed training configuration — adopted unchanged from Elangovan et al. 2025
# (PLOS Digit Health 4(9):e0000961, CC0). Holding these constant across every
# quantization arm is what makes the comparison controlled, and citing a
# published configuration is what makes it defensible.
#
# DO NOT TUNE THESE PER ARM. Only --method varies between runs.

seed: 42

training:
  learning_rate: 2.0e-4
  # Effective batch size 16, exactly as in Med-Pal. Med-Pal split it 4 x 4;
  # here it is 2 x 8, which is mathematically the same update but halves peak
  # memory. With a 152k-token vocabulary the logits of a 4-sequence micro-batch
  # need several GB, and the full-parameter arms do not fit a 15 GB T4 at 4.
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 8      # 2 x 8 = effective batch size 16
  # Recompute activations in the backward pass rather than storing them. Same
  # maths, less memory, ~25% more time. Applied to every arm, so it cannot
  # confound the comparison.
  gradient_checkpointing: true
  num_train_epochs: 3
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  logging_steps: 10
  # Only the final model is saved. Per-epoch checkpoints carry the optimizer
  # state — ~6 GB each for a full-parameter 0.5B run — and three of them
  # would exceed Kaggle's 20 GB output limit on a single arm. Resuming is
  # handled per stage by src/run_pipeline.py, so they are not needed.
  save_strategy: "no"
  optim: adamw_torch
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  max_seq_length: 1024

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.1
  bias: none
  task_type: CAUSAL_LM
  # Overridden per architecture in models.yaml where needed.
  target_modules: [q_proj, v_proj]

# Fixed generation settings, also from Med-Pal. Note sampling is ON, which is
# precisely why SCORE measures Reproducibility — and why every model in their
# study scored badly on it. Your reproducibility experiment depends on these
# being identical across arms.
inference:
  temperature: 0.2
  max_new_tokens: 512
  do_sample: true
  top_p: 0.95
  top_k: 100
  n_repeats: 3                        # for the Reproducibility x quantization experiment

# Deployment. Each arm is trained, evaluated and shipped in ONE spec, defined in
# src/quant_sim.py: qat8 -> q8_0, qat_mixed -> mixed, every other arm -> q4_0.
# The fp16 arm is additionally evaluated unquantized, as the upper bound.
# Training (QAT), evaluation and llama-quantize all use the same arithmetic,
# so the weights scored are exactly the weights the phone holds.
quantization:
  target_format: gguf_q4_0          # the format the app ships
  bits: 4
  group_size: 32
  symmetric: true

system_prompt: >-
  You are a medication information assistant. Give clear, accurate, general
  information about medicines in plain language a non-specialist can follow.
  Never give specific doses or dosing schedules. Never diagnose. Direct the
  user to a pharmacist, nurse or doctor whenever the question needs individual
  clinical judgement.
